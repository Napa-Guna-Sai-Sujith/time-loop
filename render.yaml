services:
  # 1. Backend: Python FastAPI + WebSockets + Neon PostgreSQL
  - type: web
    name: loop-backend
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ORGANIZER_DEFAULT_USERNAME
        value: admin
      - key: ORGANIZER_DEFAULT_PASSWORD
        value: "107"

  # 2. Frontend: React Vite Static Site (Optional Render Hosting)
  - type: static
    name: loop-frontend
    buildCommand: npm --prefix client install && npm --prefix client run build
    staticPublishPath: client/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: loop-backend
          property: host
